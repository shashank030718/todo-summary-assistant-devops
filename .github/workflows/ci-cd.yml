
name: Todo Summary Assistant CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-build:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        working-directory: Backend/todo-summary-assistant
        run: chmod +x mvnw && ./mvnw -B package -DskipTests

  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/todo/package-lock.json

      - name: Install dependencies
        working-directory: Frontend/todo
        run: npm ci

      - name: Build frontend
        working-directory: Frontend/todo
        run: npm run build

  deploy:
    name: Deploy to AWS EC2 through SSM
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Send deployment command
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-0230ddf1b386be181"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Todo Summary Assistant from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "sudo -u ec2-user git -C /home/ec2-user/todo-summary-assistant-devops pull --ff-only origin main",
              "cd /home/ec2-user/todo-summary-assistant-devops",
              "sudo docker compose up -d --build",
              "sudo docker compose ps"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json)

          echo "$RESULT"

          STATUS=$(echo "$RESULT" | jq -r '.Status')

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
