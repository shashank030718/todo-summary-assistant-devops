
groups:
  - name: todo-backend-alerts
    rules:
      - alert: TodoBackendDown
        expr: up{job="todo-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Todo backend is down"
          description: "Prometheus cannot scrape the Todo backend for more than 1 minute."

      - alert: TodoBackendHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Todo backend latency is high"
          description: "95th percentile request latency has exceeded 1 second for 5 minutes."
